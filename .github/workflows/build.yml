name: build-pad
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + push PAD image to Docker Hub (public)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -o pipefail
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
          docker build -t "docker.io/$DH_USER/kyc-pad:1" .
          docker push "docker.io/$DH_USER/kyc-pad:1"
          echo "=== ensure repo is public (so CF pulls without auth) ==="
          JWT=$(curl -s -X POST https://hub.docker.com/v2/users/login -H "Content-Type: application/json" -d "{\"username\":\"$DH_USER\",\"password\":\"$DH_TOKEN\"}" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(d).token||'')}catch(e){}}")
          if [ -n "$JWT" ]; then
            curl -s -X PATCH "https://hub.docker.com/v2/repositories/$DH_USER/kyc-pad/" -H "Authorization: JWT $JWT" -H "Content-Type: application/json" -d '{"is_private":false}' -o /dev/null -w "set-public http: %{http_code}\n" || true
          else
            echo "could not get hub JWT to set public (will verify/fix separately)"
          fi
          echo "IMAGE_REF=docker.io/$DH_USER/kyc-pad:1"
