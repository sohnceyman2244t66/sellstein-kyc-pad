name: build-pad
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build PAD image + push to Cloudflare managed registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ef434c4ac7895f1678dde44a64db385d
        run: |
          npx --yes wrangler@4.94.0 containers build . --tag sellstein-kyc-pad:1 --push 2>&1 | tee build-out.txt
          echo "=== pushed image reference (grep) ==="
          grep -iE "registry|image|pushed|sellstein-kyc-pad" build-out.txt || true
